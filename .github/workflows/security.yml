name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  kpkg-fuzz:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - name: Differential tests and seed corpora
        working-directory: src/kpkg
        env:
          GOTOOLCHAIN: auto
        run: go test -count=1 -run 'Fuzz|RSAForgery|RSAVerify|ModExp|XZ|Gzip|DNS|Resolver|ParseRFC1123|ParseRSASPKI' .
      - name: Fuzz RSA, DNS, xz, gzip, URL, date and key parsers (20 s each)
        working-directory: src/kpkg
        env:
          GOTOOLCHAIN: auto
        run: |
          for f in FuzzRSAVerify FuzzModExp FuzzDNSParse FuzzXZDifferential FuzzXZRoundTrip FuzzXZ FuzzXZChunks FuzzGzipRoundTrip FuzzHostOf FuzzParseRFC1123 FuzzParseRSASPKI; do
            go test -run '^$' -fuzz "^$f\$" -fuzztime 20s . || { ls testdata/fuzz/$f 2>/dev/null; exit 1; }
          done

  cve:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - name: Build kwickos container image (amd64)
        run: |
          docker build -t kwick-builder -f docker/Dockerfile.builder docker
          docker volume create kwick-cache
          make userland kpkg rootfs ARCH=amd64
          make container ARCH=amd64
      - name: CVE gate
        env:
          GOTOOLCHAIN: auto
          KWICK_BUILD_K1_VENDOR: ${{ vars.KWICK_BUILD_K1_VENDOR }}
        run: bash scripts/cve-check.sh docker:kwickos:$(cat VERSION)-amd64
