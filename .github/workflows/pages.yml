name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/img/**'
      - 'README.md'
      - 'scripts/mksite.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assemble site
        run: bash scripts/mksite.sh _site

      - name: Mirror the live signed apt repository
        run: bash scripts/mksite.sh --mirror https://metaspartan.github.io/kwickos _site

      - name: Check the artifact carries the repository
        run: |
          for f in index.html 404.html kwickos-archive-keyring.asc dists/stable/InRelease dists/stable/Release dists/stable/Release.gpg; do
            test -s "_site/$f" || { echo "missing $f"; exit 1; }
          done
          n=$(find _site/pool -name '*.deb' | wc -l)
          test "$n" -gt 0 || { echo "no packages in pool"; exit 1; }
          du -sh _site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1