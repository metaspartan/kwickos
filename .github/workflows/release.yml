name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      version: ${{ steps.t.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: |
          v=$(cat VERSION); k=$(cat KERNEL_VERSION)
          if [ "${GITHUB_REF_TYPE}" = tag ]; then tag=$GITHUB_REF_NAME; else tag="v$v-k$k"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "version=$v" >> "$GITHUB_OUTPUT"

  preflight:
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Signing key must import and sign (fail in seconds, not hours)
        env:
          KWICK_SIGNING_KEY: ${{ secrets.KWICK_SIGNING_KEY }}
          KWICK_SIGNING_PASSPHRASE: ${{ secrets.KWICK_SIGNING_PASSPHRASE }}
        run: |
          export GNUPGHOME=$(mktemp -d)
          bash scripts/gpgimport.sh
          echo test > t.txt
          gpg --batch --yes --pinentry-mode loopback --passphrase "${KWICK_SIGNING_PASSPHRASE:-}" --clearsign t.txt
          gpg --batch --list-secret-keys --keyid-format long | grep -E '^(sec|uid)' | sed 's/^\(sec *\)\([^ ]*\)/\1[key]/'

  build:
    needs: [plan, preflight]
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      release: true

  desktop:
    needs: plan
    uses: ./.github/workflows/desktop.yml

  publish:
    needs: [plan, build, desktop]
    # headless must be green; desktop images are published for whichever archs built
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dl

      - name: Collect release files
        run: |
          mkdir -p release
          for a in amd64 arm64 riscv64; do
            cp dl/kwickos-$a/kwickos-* release/ 2>/dev/null || true
            find dl/kwickos-desktop-$a -name "kwickos-$a-desktop.iso" -exec cp {} release/ \;
          done
          # disk images are sparse 1 GiB; ship them compressed
          for f in release/*.img; do [ -f "$f" ] && zstd -19 -T0 --rm -q "$f"; done
          # GitHub release assets are limited to 2 GiB each: split oversized files (cat parts > file)
          for f in $(find release -size +1900M); do split -b 1900M -d "$f" "$f.part" && rm "$f"; done
          (cd release && sha256sum * > SHA256SUMS)
          ls -lh release

      - name: Notes
        run: |
          k=$(cat KERNEL_VERSION)
          {
            echo "KwickOS $VERSION on Linux $k. Built, boot-tested and CVE-scanned by CI."
            echo
            echo "Headless: \`kwickos-<arch>.iso | .qcow2 | .img.zst | .efi | -initramfs.cpio.zst | -rootfs.tar.gz\`"
            echo "Desktop (KDE Plasma 6): \`kwickos-<arch>-desktop.iso\`"
            echo "Container: \`docker run -it ghcr.io/metaspartan/kwickos:$VERSION\`"
            echo "Kernel updates: \`apt update && apt upgrade\` (signed repo at https://metaspartan.github.io/kwickos)."
            echo; echo '```'; (cd release && cat SHA256SUMS); echo '```'
          } > notes.md

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: KwickOS ${{ env.TAG }}
          body_path: notes.md
          files: release/*
          fail_on_unmatched_files: true

      - name: Container image (multi-arch) -> ghcr.io
        env:
          REPO: ghcr.io/metaspartan/kwickos
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          refs=""
          for a in amd64 arm64 riscv64; do
            t=dl/kwickos-$a/kwickos-rootfs-$a.tar.gz
            [ -f "$t" ] || continue
            docker import --platform linux/$a --change 'CMD ["/bin/sh"]' \
              --change 'ENV PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin' "$t" "$REPO:$VERSION-$a"
            docker push "$REPO:$VERSION-$a"
            refs="$refs $REPO:$VERSION-$a"
          done
          docker buildx imagetools create -t "$REPO:$VERSION" -t "$REPO:$TAG" -t "$REPO:latest" $refs

      - name: Kernel packages + signed apt repository
        env:
          KWICK_SIGNING_KEY: ${{ secrets.KWICK_SIGNING_KEY }}
          KWICK_SIGNING_PASSPHRASE: ${{ secrets.KWICK_SIGNING_PASSPHRASE }}
        run: |
          docker build -t kwick-builder -f docker/Dockerfile.builder docker
          mkdir -p out
          for a in amd64 arm64 riscv64; do
            for f in virt generic; do
              d=dl/kwickos-$a/kernel-$f
              [ -f "$d/version" ] || continue
              mkdir -p out/$a/kernel-$f && cp -r $d/. out/$a/kernel-$f/
              docker run --rm -v "$PWD:/src" -v "$PWD/out:/out" kwick-builder bash /src/scripts/mkkernelpkg.sh $a $f
            done
          done
          docker run --rm -e KWICK_SIGNING_KEY -e KWICK_SIGNING_PASSPHRASE -v "$PWD:/src" -v "$PWD/out:/out" kwick-builder bash /src/scripts/mkrepo.sh stable
          cp -r out/repo site && touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: publish
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4