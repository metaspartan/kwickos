name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      version: ${{ steps.t.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: t
        run: |
          v=$(cat VERSION); k=$(cat KERNEL_VERSION)
          if [ "${GITHUB_REF_TYPE}" = tag ]; then tag=$GITHUB_REF_NAME; else tag="v$v-k$k"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "version=$v" >> "$GITHUB_OUTPUT"

  preflight:
    permissions:
      contents: read
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Signing key must import and sign (fail in seconds, not hours)
        env:
          KWICK_SIGNING_KEY: ${{ secrets.KWICK_SIGNING_KEY }}
          KWICK_SIGNING_PASSPHRASE: ${{ secrets.KWICK_SIGNING_PASSPHRASE }}
        run: |
          export GNUPGHOME=$(mktemp -d)
          bash scripts/gpgimport.sh
          echo test > t.txt
          printf '%s' "${KWICK_SIGNING_PASSPHRASE:-}" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --clearsign t.txt
          gpg --batch --list-secret-keys --keyid-format long | grep -E '^(sec|uid)' | sed 's/^\(sec *\)\([^ ]*\)/\1[key]/'

  security:
    permissions:
      contents: read
    needs: plan
    uses: ./.github/workflows/security.yml

  build:
    permissions:
      contents: read
    needs: [plan, preflight]
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      release: true

  desktop:
    permissions:
      contents: read
    needs: plan
    uses: ./.github/workflows/desktop.yml
    secrets: inherit
    with:
      release: true

  rpi:
    permissions:
      contents: read
    needs: [plan, preflight]
    uses: ./.github/workflows/rpi.yml
    secrets: inherit

  hyprland:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: c
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: hyprland-out
          key: kwick-hyprland-${{ matrix.arch }}-${{ hashFiles('scripts/mkhyprlandpkg.sh', 'VERSION') }}
      - name: Build kwick-hyprland from pinned upstream tags
        if: steps.c.outputs.cache-hit != 'true'
        run: |
          mkdir -p hyprland-out
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/hyprland-out:/out" debian:trixie bash /src/scripts/mkhyprlandpkg.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kwick-hyprland-${{ matrix.arch }}
          path: hyprland-out/repo/pool/main/kwick-hyprland_*.deb

  shells:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: c
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: shells-out
          key: kwick-shells-${{ matrix.arch }}-${{ hashFiles('scripts/mkquickshellpkg.sh', 'scripts/mknoctaliapkg.sh', 'VERSION') }}
      - name: Build kwick-quickshell and kwick-noctalia from pinned, checksummed releases
        if: steps.c.outputs.cache-hit != 'true'
        run: |
          mkdir -p shells-out
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/shells-out:/out" debian:trixie bash /src/scripts/mkquickshellpkg.sh ${{ matrix.arch }}
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/shells-out:/out" debian:trixie bash /src/scripts/mknoctaliapkg.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kwick-shells-${{ matrix.arch }}
          path: shells-out/repo/pool/main/kwick-*.deb

  extras:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            kind: lean
            runner: ubuntu-24.04
          - arch: arm64
            kind: lean
            runner: ubuntu-24.04-arm
          - arch: riscv64
            kind: lean
            runner: ubuntu-24.04
          - arch: arm64
            kind: plugins
            runner: ubuntu-24.04-arm
          - arch: riscv64
            kind: plugins
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    env:
      A: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.arch == 'riscv64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - id: c
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: extras-out/kwick-extras.tgz
          key: kwick-extras-${{ matrix.kind }}-${{ matrix.arch }}-${{ hashFiles('VERSION', 'config/musl-lean/sources', 'scripts/build-musl-lean.sh', 'scripts/mkleancurlpkg.sh', 'scripts/kwin-plugin.sh', 'scripts/mkflippkg.sh', 'scripts/mkglasspkg.sh', 'scripts/mkmacstylepkg.sh', 'scripts/mkroundedpkg.sh', 'scripts/mkkeyboardpkg.sh', 'scripts/mkspotlightpkg.sh', 'scripts/mksettingspkg.sh', 'scripts/mknativepkg.sh', 'src/kwin-flip/**', 'src/kwin-liquidglass/**', 'src/kwick-macstyle/**', 'src/kwick-spotlight/**', 'src/kwick-settings/**', 'src/kwick-nearby/**', 'src/kwick-quicklook/**', 'src/kwick-capture/**') }}
      - name: Build ${{ matrix.kind }} for ${{ matrix.arch }}
        if: steps.c.outputs.cache-hit != 'true'
        run: |
          mkdir -p out
          if [ "${{ matrix.kind }}" = lean ]; then
            docker run --rm --platform linux/$A -e JOBS="$(nproc)" -v "$PWD:/src" -v "$PWD/out:/out" alpine:3.22 sh -c "apk add -q --no-cache bash curl && bash /src/scripts/build-musl-lean.sh $A"
            docker run --rm --platform linux/$A -v "$PWD:/src" -v "$PWD/out:/out" debian:trixie bash /src/scripts/mkleancurlpkg.sh
          else
            docker run --rm --platform linux/$A -v "$PWD:/src" -v "$PWD/out:/out" debian:trixie bash -c "bash /src/scripts/mkflippkg.sh /out/kwin-flip-$A && bash /src/scripts/mkglasspkg.sh /out/kwin-liquidglass-$A && bash /src/scripts/mkmacstylepkg.sh /out/kwin-macstyle-$A && bash /src/scripts/mkroundedpkg.sh /out/kwin-rounded-$A && bash /src/scripts/mkkeyboardpkg.sh /out/kwin-keyboard-$A && bash /src/scripts/mkspotlightpkg.sh /out/kwin-spotlight-$A && bash /src/scripts/mksettingspkg.sh /out/kwin-settings-$A && bash /src/scripts/mknativepkg.sh /out/kwin-native-$A"
          fi
          sudo chown -R "$(id -u):$(id -g)" out
          mkdir -p extras-out
          tar -C out -czf extras-out/kwick-extras.tgz .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kwick-extras-${{ matrix.kind }}-${{ matrix.arch }}
          path: extras-out/kwick-extras.tgz

  publish:
    permissions:
      contents: write
      packages: write
    needs: [plan, security, build, desktop, hyprland, shells, rpi, extras]
    if: ${{ always() && needs.build.result == 'success' && needs.security.result == 'success' && needs.extras.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dl

      - name: Collect release files
        run: |
          mkdir -p release
          for a in amd64 arm64 riscv64; do
            cp dl/kwickos-$a/kwickos-* release/ 2>/dev/null || true
            [ -d dl/kwickos-desktop-$a ] && find dl/kwickos-desktop-$a -name "kwickos-$a-desktop.iso" -exec cp {} release/ \; || true
          done
          f=$(find dl/kwickos-arm64-rpi -name kwickos-arm64-rpi.img.zst 2>/dev/null | head -n 1)
          if [ -n "$f" ]; then cp "$f" release/; else echo "::warning::no Raspberry Pi image in this release"; fi
          for f in release/*.img; do [ -f "$f" ] && zstd -19 -T0 --rm -q "$f"; done
          for f in $(find release -size +1900M); do split -b 1900M -d "$f" "$f.part" && rm "$f"; done
          (cd release && sha256sum * > SHA256SUMS)
          ls -lh release

      - name: Notes
        run: |
          k=$(cat KERNEL_VERSION)
          {
            echo "KwickOS $VERSION on Linux $k. Built, boot-tested and CVE-scanned by CI."
            echo
            echo "Headless: \`kwickos-<arch>.iso | .qcow2 | .img.zst | .efi | -initramfs.cpio.zst | -rootfs.tar.gz\`"
            echo "Desktop (KDE Plasma 6): \`kwickos-<arch>-desktop.iso\`"
            echo "Raspberry Pi 4, 400, 5 and 500: \`kwickos-arm64-rpi.img.zst\` (write it to an SD card or USB drive)"
            echo "Container: \`docker run -it ghcr.io/metaspartan/kwickos:$VERSION\`"
            echo "Kernel updates: \`apt update && apt upgrade\` (signed repo at https://metaspartan.github.io/kwickos)."
            [ -f "docs/notes/$VERSION.md" ] && { echo; cat "docs/notes/$VERSION.md"; }
            echo; echo '```'; (cd release && cat SHA256SUMS); echo '```'
          } > notes.md

      - name: GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: KwickOS ${{ env.TAG }}
          body_path: notes.md
          files: release/*
          fail_on_unmatched_files: true

      - name: Container image (multi-arch) -> ghcr.io
        env:
          REPO: ghcr.io/metaspartan/kwickos
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          refs=""
          for a in amd64 arm64 riscv64; do
            t=dl/kwickos-$a/kwickos-rootfs-$a.tar.gz
            [ -f "$t" ] || continue
            docker import --platform linux/$a --change 'CMD ["/bin/sh"]' \
              --change 'ENV PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin' "$t" "$REPO:$VERSION-$a"
            docker push "$REPO:$VERSION-$a"
            refs="$refs $REPO:$VERSION-$a"
          done
          docker buildx imagetools create -t "$REPO:$VERSION" -t "$REPO:$TAG" -t "$REPO:latest" $refs

      - name: Set up QEMU user emulation (arm64 and riscv64 KWin plugin builds)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64,riscv64

      - name: Kernel packages + signed apt repository
        env:
          KWICK_SIGNING_KEY: ${{ secrets.KWICK_SIGNING_KEY }}
          KWICK_SIGNING_PASSPHRASE: ${{ secrets.KWICK_SIGNING_PASSPHRASE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker build -t kwick-builder -f docker/Dockerfile.builder docker
          mkdir -p out
          for a in amd64 arm64 riscv64; do
            for f in virt generic k1 k1mainline; do
              d=dl/kwickos-$a/kernel-$f
              [ -f "$d/version" ] || continue
              mkdir -p out/$a/kernel-$f && cp -r $d/. out/$a/kernel-$f/
              docker run --rm -v "$PWD:/src" -v "$PWD/out:/out" kwick-builder bash /src/scripts/mkkernelpkg.sh $a $f
            done
          done
          docker run --rm -v "$PWD:/src" -v "$PWD/out:/out" kwick-builder bash /src/scripts/mkgpupkg.sh
          docker run --rm -v "$PWD:/src" -v "$PWD/out:/out" kwick-builder bash /src/scripts/mkgamingpkg.sh
          docker run --rm -v "$PWD:/src" -v "$PWD/out:/out" kwick-builder bash /src/scripts/mkpenpkg.sh
          docker run --rm -v "$PWD:/src" -v "$PWD/out:/out" kwick-builder bash /src/scripts/mkessentialspkg.sh
          docker run --rm -v "$PWD:/src" -v "$PWD/out:/out" kwick-builder bash /src/scripts/mkagentspkg.sh
          docker run --rm -v "$PWD:/src" -v "$PWD/out:/out" kwick-builder bash /src/scripts/mkarchpkg.sh
          docker run --rm -v "$PWD:/src" -v "$PWD/out:/out" kwick-builder bash /src/scripts/mkupdatepkg.sh
          for a in amd64 arm64 riscv64; do docker run --rm -v "$PWD:/src" -v "$PWD/out:/out" kwick-builder bash /src/scripts/mkcorepkg.sh $a /src/dl/kwickos-$a/kwickos-rootfs-$a.tar.gz; done
          docker run --rm -v "$PWD:/src" -v "$PWD/out:/out" kwick-builder bash /src/scripts/mkstoragepkg.sh
          docker run --rm -v "$PWD:/src" -v "$PWD/out:/out" debian:trixie bash /src/scripts/mkcarrierpkg.sh
          sudo mkdir -p out; for t in dl/kwick-extras-*/kwick-extras.tgz; do sudo tar -C out -xzf "$t"; done
          for a in amd64 arm64 riscv64; do docker run --rm -v "$PWD:/src" -v "$PWD/out:/out" kwick-builder bash /src/scripts/mkdesktoppkg.sh $a; done
          sudo chown -R "$(id -u):$(id -g)" out
          cp dl/kwickos-zfs-*/kwick-zfs*.deb out/repo/pool/main/ 2>/dev/null || echo "::warning::no OpenZFS module packages in this release"
          cp dl/kwick-hyprland-*/kwick-hyprland_*.deb out/repo/pool/main/ 2>/dev/null || true
          cp dl/kwick-shells-*/kwick-*.deb out/repo/pool/main/ 2>/dev/null || echo "::warning::no kwick-quickshell or kwick-noctalia packages in this release"
          find dl/kwickos-arm64-rpi -name "*.deb" -exec cp {} out/repo/pool/main/ \; 2>/dev/null || true
          . config/darling.env; mkdir -p out/repo/pool/main
          gh release download "darling-${DARLING_TAG#v}-${DARLING_PKG_REVISION}" -p 'kwick-darling_*.deb' -D out/repo/pool/main || true
          docker run --rm -e KWICK_SIGNING_KEY -e KWICK_SIGNING_PASSPHRASE -v "$PWD:/src" -v "$PWD/out:/out" kwick-builder bash /src/scripts/mkrepo.sh stable
          cp -r out/repo _site
          bash scripts/mksite.sh _site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  pages:
    permissions:
      pages: write
      id-token: write
    needs: publish
    runs-on: ubuntu-24.04
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1