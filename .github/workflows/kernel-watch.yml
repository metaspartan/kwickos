name: kernel-watch

# Track the newest stable kernel from kernel.org. When a new release (and
# therefore new CVE fixes) appears, commit the bump to main and dispatch the release workflow, which
# builds + boot-tests every arch and publishes the kernel to the apt repo so `apt upgrade` delivers it to every KwickOS system.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Latest stable
        id: k
        run: |
          latest=$(curl -fsSL https://www.kernel.org/releases.json | jq -r '[.releases[]|select(.moniker=="stable" and .iseol==false)][0].version')
          current=$(cat KERNEL_VERSION)
          echo "latest=$latest current=$current"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          [ "$latest" != "$current" ] && echo "$latest" > KERNEL_VERSION || true
      - name: Commit bump to main and release
        if: steps.k.outputs.latest != steps.k.outputs.current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "kwickos-bot"; git config user.email "bot@users.noreply.github.com"
          git add KERNEL_VERSION
          git commit -m "kernel: bump ${{ steps.k.outputs.current }} -> ${{ steps.k.outputs.latest }}"
          git push origin HEAD:main
          # pushes made with GITHUB_TOKEN do not trigger workflows: start the release explicitly.
          # release.yml builds + boot-tests everything and only publishes when green.
          gh workflow run release.yml --ref main