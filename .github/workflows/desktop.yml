name: desktop

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions: {}

jobs:
  desktop:
    permissions:
      contents: read
    name: desktop-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space (desktop rootfs is ~4 GB unpacked)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af >/dev/null
          df -h /

      - name: Builder image
        run: docker build -t kwick-builder -f docker/Dockerfile.builder docker

      - name: Archive public key (release builds)
        if: inputs.release
        env:
          KWICK_SIGNING_KEY: ${{ secrets.KWICK_SIGNING_KEY }}
          KWICK_SIGNING_PASSPHRASE: ${{ secrets.KWICK_SIGNING_PASSPHRASE }}
        run: |
          mkdir -p keys
          export GNUPGHOME=$(mktemp -d)
          bash scripts/gpgimport.sh
          gpg --batch --armor --export > keys/archive-key.asc
          test -s keys/archive-key.asc

      - name: Base build (userland, kpkg, generic kernel, rootfs)
        env:
          KWICK_REPO_URL: ${{ inputs.release && 'https://metaspartan.github.io/kwickos' || '' }}
          KWICK_REPO_KEY: ${{ inputs.release && '/src/keys/archive-key.asc' || '' }}
        run: |
          docker volume create kwick-cache
          mkdir -p out
          make userland kpkg kernel-generic rootfs ARCH=$ARCH KVER=$(cat KERNEL_VERSION)
          gzip -dc out/$ARCH/kwickos-rootfs-$ARCH.tar.gz | tar --delete -f - ./etc/dpkg/dpkg.cfg.d/excludes | gzip -n > "$RUNNER_TEMP/desktop-base-$ARCH.tar.gz"
          make container ARCH=$ARCH ROOTFS_TAR="$RUNNER_TEMP/desktop-base-$ARCH.tar.gz"

      - name: Desktop rootfs (Plasma, drivers, firmware, effects)
        run: docker build --progress=plain --build-context kwinflipsrc=src/kwin-flip --build-context kwinglasssrc=src/kwin-liquidglass --build-context macstylesrc=src/kwick-macstyle --build-context spotlightsrc=src/kwick-spotlight --build-context settingssrc=src/kwick-settings --build-context nativesrc=src --build-context kwickscripts=scripts --build-arg BASE=kwickos:$(cat VERSION)-$ARCH -t kwickos-desktop:ci desktop/

      - name: KwickOS packages the image registers (kwick-desktop and what it depends on)
        run: |
          docker run --rm -v "$PWD:/src" -v "$PWD/out:/out" kwick-builder bash -c "
            bash /src/scripts/mkkernelpkg.sh $ARCH generic && bash /src/scripts/mkgpupkg.sh && bash /src/scripts/mkgamingpkg.sh &&
            bash /src/scripts/mkessentialspkg.sh && bash /src/scripts/mkupdatepkg.sh && bash /src/scripts/mkcorepkg.sh $ARCH &&
            bash /src/scripts/mkdesktoppkg.sh $ARCH"
          ls -l out/repo/pool/main/

      - name: Desktop live ISO
        run: |
          docker create --name deskx kwickos-desktop:ci /bin/true
          docker export deskx -o "$PWD/out/desktop-rootfs.tar"
          docker rm deskx
          docker run --rm -v "$PWD:/src" -v "$PWD/out:/out" -v kwick-build:/build kwick-builder \
            bash /src/scripts/mkdesktop-iso.sh $ARCH /out/desktop-rootfs.tar
          rm -f out/desktop-rootfs.tar
          ls -l out/$ARCH/

      - name: Boot test (live ISO reaches the Plasma session)
        if: matrix.arch == 'amd64'
        run: |
          [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm || true
          docker run --rm $( [ -w /dev/kvm ] && echo --device /dev/kvm ) -v "$PWD:/src" -v "$PWD/out:/out" \
            kwick-builder bash /src/tests/desktop-boot.sh /out/$ARCH/kwickos-$ARCH-desktop.iso /out/desktop-shot.png

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kwickos-desktop-${{ matrix.arch }}
          path: |
            out/${{ matrix.arch }}/kwickos-${{ matrix.arch }}-desktop.iso
            out/desktop-shot.png
          retention-days: 14