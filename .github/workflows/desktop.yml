name: desktop

# KwickOS Desktop (KDE Plasma 6) live ISOs. Reused by release.yml; can also be run by hand.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  desktop:
    name: desktop-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (desktop rootfs is ~4 GB unpacked)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af >/dev/null
          df -h /

      - name: Builder image
        run: docker build -t kwick-builder -f docker/Dockerfile.builder docker

      - name: Base build (userland, kpkg, generic kernel, rootfs)
        run: |
          docker volume create kwick-cache
          mkdir -p out
          make userland kpkg kernel-generic rootfs ARCH=$ARCH KVER=$(cat KERNEL_VERSION)
          make container ARCH=$ARCH

      - name: Desktop rootfs (Plasma, drivers, firmware, effects)
        run: docker build --progress=plain --build-arg BASE=kwickos:$(cat VERSION)-$ARCH -t kwickos-desktop:ci desktop/

      - name: Desktop live ISO
        run: |
          docker create --name deskx kwickos-desktop:ci /bin/true
          docker export deskx -o "$PWD/out/desktop-rootfs.tar"
          docker rm deskx
          docker run --rm -v "$PWD:/src" -v "$PWD/out:/out" -v kwick-build:/build kwick-builder \
            bash /src/scripts/mkdesktop-iso.sh $ARCH /out/desktop-rootfs.tar
          rm -f out/desktop-rootfs.tar
          ls -l out/$ARCH/

      - name: Boot test (live ISO reaches the Plasma session)
        if: matrix.arch == 'amd64'
        run: |
          [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm || true
          docker run --rm $( [ -w /dev/kvm ] && echo --device /dev/kvm ) -v "$PWD:/src" -v "$PWD/out:/out" \
            kwick-builder bash /src/tests/desktop-boot.sh /out/$ARCH/kwickos-$ARCH-desktop.iso /out/desktop-shot.png

      - uses: actions/upload-artifact@v4
        with:
          name: kwickos-desktop-${{ matrix.arch }}
          path: |
            out/${{ matrix.arch }}/kwickos-${{ matrix.arch }}-desktop.iso
            out/desktop-shot.png
          retention-days: 14