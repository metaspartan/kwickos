name: autorelease

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'bench/**', '.github/workflows/security.yml']
  workflow_dispatch:

permissions: {}

jobs:
  plan:
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dispatch release if this version+kernel has none yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(cat VERSION)-k$(cat KERNEL_VERSION)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already released - bump VERSION for a new release"
          else
            gh workflow run release.yml --ref main
            echo "dispatched release $tag"
          fi