# kinit has no socket activation: dbus-daemon creates its own socket and
# activates services itself (no --systemd-activation). It must start as root
# to bind /run/dbus/system_bus_socket; it then drops to messagebus by itself
# (<user> in system.conf).
[Service]
User=
Group=
ExecStartPre=/bin/mkdir -p /run/dbus
ExecStartPre=/bin/rm -f /run/dbus/system_bus_socket /run/dbus/pid
ExecStartPre=/usr/bin/dbus-uuidgen --ensure=/etc/machine-id
ExecStart=
ExecStart=/usr/bin/dbus-daemon --system --nofork --nopidfile
Restart=always
