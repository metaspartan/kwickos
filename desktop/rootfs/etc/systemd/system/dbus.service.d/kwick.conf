# kinit has no socket activation: dbus-daemon creates its own socket and
# activates services itself (no --systemd-activation).
[Service]
ExecStartPre=/bin/mkdir -p /run/dbus
ExecStartPre=/usr/bin/dbus-uuidgen --ensure=/etc/machine-id
ExecStart=
ExecStart=/usr/bin/dbus-daemon --system --nofork --nopidfile
Restart=always
