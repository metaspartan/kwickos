[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell,QT_QPA_PLATFORMTHEME=kde
Numlock=on
InputMethod=

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1 --inputmethod plasma-keyboard

[Theme]
FacesDir=/usr/share/kwick/faces
Current=breeze
CursorTheme=breeze_cursors

[Users]
MinimumUid=1000
