<?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Common Windows/macOS font names map to the best free equivalent -->
  <alias binding="same"><family>Segoe UI</family><prefer><family>Open Sans</family></prefer></alias>
  <alias binding="same"><family>Calibri</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Cambria</family><prefer><family>Caladea</family></prefer></alias>
  <alias binding="same"><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Helvetica</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Helvetica Neue</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Pro Text</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Pro Display</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>-apple-system</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>Menlo</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias binding="same"><family>Consolas</family><prefer><family>JetBrains Mono</family></prefer></alias>
</fontconfig>