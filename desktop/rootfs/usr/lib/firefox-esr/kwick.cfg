"use strict";
try {
  const Cc = Components.classes;
  const Ci = Components.interfaces;
  const env = Cc["@mozilla.org/process/environment;1"].getService(Ci.nsIEnvironment);
  const config = env.get("XDG_CONFIG_HOME") || env.get("HOME") + "/.config";
  const read = (path) => {
    const file = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
    file.initWithPath(path);
    if (!file.exists()) {
      return "";
    }
    const stream = Cc["@mozilla.org/network/file-input-stream;1"].createInstance(Ci.nsIFileInputStream);
    stream.init(file, 1, 0, 0);
    const text = Cc["@mozilla.org/scriptableinputstream;1"].createInstance(Ci.nsIScriptableInputStream);
    text.init(stream);
    const value = text.read(64).trim();
    text.close();
    return value;
  };
  const layout = read(config + "/kwick/layout") || "macos";
  if (layout === "macos") {
    defaultPref("ui.key.menuAccessKey", 0);
  }
  if (/^[a-z]+$/.test(layout)) {
    const sheet = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
    sheet.initWithPath("/usr/share/kwick/firefox/" + layout + ".css");
    if (sheet.exists()) {
      const sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
      const uri = Cc["@mozilla.org/network/io-service;1"].getService(Ci.nsIIOService).newFileURI(sheet);
      if (!sss.sheetRegistered(uri, sss.AGENT_SHEET)) {
        sss.loadAndRegisterSheet(uri, sss.AGENT_SHEET);
      }
    }
  }
} catch (e) {
}
