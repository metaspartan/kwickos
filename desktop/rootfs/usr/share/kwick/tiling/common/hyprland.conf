monitor = , preferred, auto, 1

env = XCURSOR_SIZE,24
env = XCURSOR_THEME,breeze_cursors
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland;xcb
env = MOZ_ENABLE_WAYLAND,1

exec-once = /usr/lib/kwick/pipewire-session
exec-once = sh -c "kwick-layout $(kwick-layout)"
exec-once = kwick-spotlight --daemon
exec-once = kwick-clipboard watch
exec-once = kwick-nearby --autostart

exec-once = swayidle -w timeout 600 'swaylock -f' timeout 900 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on' before-sleep 'swaylock -f'

animations {
  enabled = true
  bezier = quick, 0.15, 0, 0.1, 1
  bezier = smooth, 0.32, 0.72, 0, 1
  animation = windows, 1, 4, smooth, slide
  animation = windowsOut, 1, 3, quick, popin 85%
  animation = fade, 1, 4, quick
  animation = border, 1, 6, quick
  animation = workspaces, 1, 5, smooth, slide
}

source = ~/.config/hypr/kwick-layout.conf
source = ~/.config/hypr/kwick-effects.conf
source = ~/.config/hypr/kwick-bars.conf
source = ~/.config/hypr/kwick-touch.conf

input {
  kb_layout = us
  follow_mouse = 1
  repeat_rate = 40
  repeat_delay = 250
  touchpad {
    natural_scroll = true
    tap-to-click = true
  }
}

gestures {
  workspace_swipe = true
}

dwindle {
  pseudotile = true
  preserve_split = true
  force_split = 2
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  force_default_wallpaper = 0
  focus_on_activate = true
  disable_hyprland_qtutils_check = true
}

layerrule = blur, notifications
layerrule = blur, launcher
layerrule = ignorealpha 0.3, notifications
layerrule = ignorealpha 0.3, launcher
layerrule = blur, kwick-spotlight
layerrule = ignorealpha 0.5, kwick-spotlight
layerrule = noanim, kwick-spotlight

windowrulev2 = float, class:^(pavucontrol|nm-connection-editor|org.gnome.Calculator|kwick-quicklook|kwick-capture)$
windowrulev2 = center, class:^(kwick-quicklook|kwick-capture)$

$mod = SUPER

source = ~/.config/hypr/kwick-keys.conf

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
