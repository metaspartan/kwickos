monitor = , preferred, auto, 1

env = XCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland;xcb
env = MOZ_ENABLE_WAYLAND,1

exec-once = /usr/lib/kwick/pipewire-session
exec-once = sh -c "kwick-layout $(kwick-layout)"

exec-once = swayidle -w timeout 600 'swaylock -f' timeout 900 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on' before-sleep 'swaylock -f'

source = ~/.config/hypr/kwick-layout.conf
source = ~/.config/hypr/kwick-effects.conf

input {
  kb_layout = us
  follow_mouse = 1
  repeat_rate = 40
  repeat_delay = 250
  touchpad {
    natural_scroll = true
    tap-to-click = true
  }
}

gestures {
  workspace_swipe = true
}

dwindle {
  pseudotile = true
  preserve_split = true
  force_split = 2
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  force_default_wallpaper = 0
  focus_on_activate = true
}

animations {
  enabled = true
  bezier = quick, 0.15, 0, 0.1, 1
  bezier = smooth, 0.32, 0.72, 0, 1
  animation = windows, 1, 4, smooth, slide
  animation = windowsOut, 1, 3, quick, popin 85%
  animation = fade, 1, 4, quick
  animation = border, 1, 6, quick
  animation = workspaces, 1, 5, smooth, slide
}

layerrule = blur, waybar
layerrule = blur, notifications
layerrule = blur, launcher
layerrule = ignorealpha 0.3, waybar
layerrule = ignorealpha 0.3, notifications
layerrule = ignorealpha 0.3, launcher

windowrulev2 = float, class:^(pavucontrol|nm-connection-editor|org.gnome.Calculator)$

$mod = SUPER

bind = $mod, Return, exec, kwick-terminal
bind = $mod, Space, exec, fuzzel
bind = $mod, D, exec, fuzzel
bind = $mod, B, exec, firefox-esr
bind = $mod, E, exec, xdg-open ~
bind = $mod, W, killactive
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, P, pseudo
bind = $mod, J, togglesplit
bind = $mod, K, exec, kwick-keys
bind = $mod, slash, exec, kwick-keys
bind = $mod, L, exec, swaylock -f
bind = $mod SHIFT, E, exit

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, swapwindow, l
bind = $mod SHIFT, right, swapwindow, r
bind = $mod SHIFT, up, swapwindow, u
bind = $mod SHIFT, down, swapwindow, d
bind = $mod, minus, resizeactive, -100 0
bind = $mod, equal, resizeactive, 100 0

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod, Tab, workspace, e+1
bind = $mod SHIFT, Tab, workspace, e-1
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim - | wl-copy
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
