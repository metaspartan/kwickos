set $mod Mod4

exec /usr/lib/kwick/pipewire-session
exec sh -c "kwick-layout $(kwick-layout)"
exec kwick-spotlight --daemon
exec kwick-clipboard watch
exec kwick-nearby --autostart
exec swayidle -w timeout 600 'swaylock -f' timeout 900 'swaymsg "output * power off"' resume 'swaymsg "output * power on"' before-sleep 'swaylock -f'

include ~/.config/sway/kwick-layout.conf

input type:keyboard {
  xkb_layout us
  repeat_rate 40
  repeat_delay 250
}
input type:touchpad {
  natural_scroll enabled
  tap enabled
}

floating_modifier $mod normal
focus_follows_mouse yes
workspace_layout default
default_orientation auto

for_window [app_id="pavucontrol"] floating enable
for_window [app_id="^(kwick-quicklook|kwick-capture)$"] floating enable

include ~/.config/sway/kwick-keys.conf

bindsym --locked XF86AudioRaiseVolume exec wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindsym --locked XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym --locked XF86MonBrightnessUp exec brightnessctl set 5%+
bindsym --locked XF86MonBrightnessDown exec brightnessctl set 5%-

bar swaybar_command true
