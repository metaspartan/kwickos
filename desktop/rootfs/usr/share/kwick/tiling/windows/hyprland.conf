general {
  gaps_in = 4
  gaps_out = 8
  border_size = 1
  col.active_border = rgba(ffffff22)
  col.inactive_border = rgba(ffffff12)
  layout = dwindle
}

decoration {
  rounding = 8
  shadow {
    enabled = true
    range = 20
    render_power = 3
    color = rgba(00000055)
  }
  blur {
    enabled = true
    size = 8
    passes = 3
    vibrancy = 0.2
  }
}

layerrule = blur, waybar
layerrule = ignorealpha 0.3, waybar
