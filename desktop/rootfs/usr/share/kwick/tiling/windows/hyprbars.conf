plugin {
  hyprbars {
    bar_height = 32
    bar_color = rgba(202020ff)
    col.text = rgba(ffffffff)
    bar_text_size = 9
    bar_text_font = Selawik
    bar_text_align = left
    bar_part_of_window = true
    bar_precedence_over_border = true
    bar_buttons_alignment = right
    bar_padding = 12
    bar_button_padding = 26
    hyprbars-button = rgba(00000000), 16, ✕, hyprctl dispatch killactive, rgba(ffffffff)
    hyprbars-button = rgba(00000000), 16, ☐, hyprctl dispatch fullscreen 1, rgba(ffffffff)
    hyprbars-button = rgba(00000000), 16, ─, hyprctl dispatch movetoworkspacesilent special, rgba(ffffffff)
  }
}

windowrulev2 = plugin:hyprbars:nobar, class:^(org\.gnome\..*|firefox.*|steam.*)$
