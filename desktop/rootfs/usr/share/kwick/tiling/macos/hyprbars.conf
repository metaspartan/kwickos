plugin {
  hyprbars {
    bar_height = 28
    bar_color = rgba(@TITLE_RAW@ff)
    col.text = rgba(@TITLE_TEXT_RAW@)
    bar_text_size = 10
    bar_text_font = Inter Bold
    bar_text_align = center
    bar_part_of_window = true
    bar_precedence_over_border = true
    bar_buttons_alignment = left
    bar_padding = 12
    bar_button_padding = 7
    hyprbars-button = rgb(ff5f57), 14, , hyprctl dispatch killactive
    hyprbars-button = rgb(febc2e), 14, , hyprctl dispatch movetoworkspacesilent special
    hyprbars-button = rgb(28c840), 14, , hyprctl dispatch fullscreen 1
  }
}

windowrulev2 = plugin:hyprbars:nobar, class:^(org\.gnome\..*|firefox.*|steam.*)$
