plugin {
  hyprbars {
    bar_height = 32
    bar_color = rgba(24242cf2)
    col.text = rgba(ffffffd0)
    bar_text_size = 11
    bar_text_font = Inter
    bar_text_align = center
    bar_part_of_window = true
    bar_precedence_over_border = true
    bar_buttons_alignment = left
    bar_padding = 12
    bar_button_padding = 8
    hyprbars-button = rgb(ff5f57), 12, , hyprctl dispatch killactive
    hyprbars-button = rgb(febc2e), 12, , hyprctl dispatch movetoworkspacesilent special
    hyprbars-button = rgb(28c840), 12, , hyprctl dispatch fullscreen 1
  }
}

windowrulev2 = plugin:hyprbars:nobar, class:^(org\.gnome\..*|firefox.*|steam.*)$
